<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Detail</title>
</head>
<body>
    <h1>Student Detail: {{ student.user.name }}</h1>
    <p>Email: {{ student.user.email }}</p>
    <p>Student ID: {{ student.student_id }}</p>
    <p>Course: {{ student.course_code }}</p>
    <p>Risk Score: {{ student.current_risk_score }}</p>
    <p>Consecutive Misses: {{ student.consecutive_misses }}</p>
</body>
</html>

{% extends "admin_base.html" %}

{% block admin_content %}
<div class="row">
    <!-- Row 1: Users and Grades -->
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Import Users</h5>
                <a href="{{ url_for('admin.download_template', type='users') }}"
                    class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-download"></i> Template
                </a>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_users') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="userFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="userFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Users</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Import Grades</h5>
                <a href="{{ url_for('admin.download_template', type='grades') }}"
                    class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-download"></i> Template
                </a>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_grades') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="gradeFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="gradeFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Grades</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Row 2: Attendance and Surveys -->
<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Import Attendance</h5>
                <a href="{{ url_for('admin.download_template', type='attendance') }}"
                    class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-download"></i> Template
                </a>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_attendance') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="attendanceFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="attendanceFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Attendance</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Import Surveys</h5>
                <a href="{{ url_for('admin.download_template', type='surveys') }}"
                    class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-download"></i> Template
                </a>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_surveys') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="surveyFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="surveyFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Surveys</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

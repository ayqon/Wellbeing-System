{% extends "admin_base.html" %}

{% block admin_content %}
<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Import Users</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_users') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="userFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="userFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Users</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Import Academic Data</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('admin.import_academic') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="academicFile" class="form-label">Select CSV File</label>
                        <input class="form-control" type="file" id="academicFile" name="file" accept=".csv" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload Academic Data</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Wellbeing Survey{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h1 class="mb-4">Weekly Check-in</h1>
    <p class="mb-4" style="color: var(--text-secondary);">Please rate your wellbeing for Week {{ week }} of {{ year }}.
    </p>

    <form id="surveyForm">
        <input type="hidden" id="student_id" value="{{ current_user.username }}">
        <input type="hidden" id="week" value="{{ week }}">
        <input type="hidden" id="year" value="{{ year }}">

        <div class="form-group">
            <label for="stress">Stress Level (1-5)</label>
            <div
                style="display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 0.5rem;">
                <span>Low Stress</span>
                <span>High Stress</span>
            </div>
            <input type="range" id="stress" name="stress" min="1" max="5" step="1" value="3"
                oninput="this.nextElementSibling.value = this.value">
            <output style="display: block; text-align: center; font-weight: bold; margin-top: 0.5rem;">3</output>
        </div>

        <div class="form-group">
            <label for="sleep">Average Sleep (Hours)</label>
            <input type="number" id="sleep" name="sleep" min="0" max="24" step="0.25" required placeholder="e.g. 7.5">
        </div>

        <div class="flex gap-4 mt-4">
            <button type="submit" style="flex: 2;">Submit Check-in</button>
            <button type="button" id="skipBtn" class="btn-secondary" style="flex: 1;">Skip</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('surveyForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        let sleepValue = parseFloat(document.getElementById('sleep').value);

        // Round to nearest quarter (0.25)
        sleepValue = Math.round(sleepValue * 4) / 4;

        // Ensure within bounds
        sleepValue = Math.max(0, Math.min(24, sleepValue));

        // Format to 2 decimal places
        sleepValue = parseFloat(sleepValue.toFixed(2));

        const data = {
            student_id: document.getElementById('student_id').value,
            week: parseInt(document.getElementById('week').value),
            year: parseInt(document.getElementById('year').value),
            stress: parseInt(document.getElementById('stress').value),
            sleep: sleepValue
        };

        try {
            const response = await fetch("{{ url_for('surveys.submit_survey') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = "{{ url_for('surveys.student_dashboard') }}";
            } else {
                alert('Error: ' + (result.error || 'Failed to submit survey'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while submitting the survey.');
        }
    });

    document.getElementById('skipBtn').addEventListener('click', async function () {
        if (!confirm('Are you sure you want to skip this week\'s check-in?')) {
            return;
        }

        const data = {
            student_id: document.getElementById('student_id').value,
            week: parseInt(document.getElementById('week').value),
            year: parseInt(document.getElementById('year').value)
        };

        try {
            const response = await fetch("{{ url_for('surveys.skip_survey') }}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                window.location.href = "{{ url_for('surveys.student_dashboard') }}";
            } else {
                alert('Error: ' + (result.error || 'Failed to skip survey'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while skipping the survey.');
        }
    });
</script>
{% endblock %}

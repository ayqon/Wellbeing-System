[tool.poetry]
name = "swats"
version = "0.1.0"
description = "Student Wellbeing Analytics & Tracking System"
authors = ["Admin <admin@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0"
sqlalchemy = "^2.0"
pydantic = "^2.0"
alembic = "^1.13"
bcrypt = "^4.1"
pyjwt = "^2.8"
flask-smorest = "^0.42"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
flake8 = "^7.0"
mypy = "^1.8"
pytest = "^8.0"
pytest-cov = "^4.1"

[tool.black]
line-length = 88

[tool.mypy]
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
